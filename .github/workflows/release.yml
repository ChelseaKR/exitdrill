name: release

# Trusted-main, signed-tag, split-authority release, dispatch only.
#
# NOT YET USED: no version of ExitDrill has been tagged or released. This
# workflow is prepared ahead of the first tag so cutting v0.1.0 does not also
# require writing a release pipeline under time pressure. It runs only when a
# maintainer dispatches it with an existing signed annotated tag. The shared
# authorization workflow checks out trusted main, requires stable SemVer,
# verifies the annotated tag object and its SSH signature against
# .github/allowed_signers, and requires the tagged commit to be an ancestor of
# origin/main. The build job then re-runs the exact local gate set (make
# verify plus both declared demo outcomes) at that verified commit and builds
# the wheel, sdist, and checksums. The publish job holds the only write
# authority, never checks out code, rechecks the immutable tag object against
# the live repository, and publishes the GitHub Release.
#
# Deliberately out of scope until an explicit decision records otherwise:
# PyPI or any package-registry publishing (no trusted publisher configured).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    permissions:
      contents: read
    uses: ChelseaKR/.github/.github/workflows/release-authorize.yml@7be4c3e44e2acf20e8a98eeea4351c1e5d2789bc
    with:
      tag: ${{ inputs.tag }}

  build:
    name: re-verify at the tagged commit and build the candidate
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: false
      # Before anything expensive. The tag/version match and the release notes
      # are file reads; `make verify` plus both demos plus the wheel build is
      # most of half an hour. These two used to run around that build — the
      # version match before it and the CHANGELOG section after it — so a
      # release with no notes burned the whole job before saying so, and the
      # notes gate could not be run anywhere but here. It is a script now, so
      # `make release-preflight` answers the same question from a laptop and
      # `tests/test_release_preflight.py` can exercise it.
      - name: Refuse the release before anything expensive runs
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
        run: |
          uv run --no-project python scripts/check_release_preflight.py \
            --tag "${RELEASE_TAG}" --out release-notes.md
      - name: Verify and build the candidate at the verified commit
        run: |
          uv sync --locked
          make verify
          make demo
          make demo-lossy
          make package
          # Names relative to dist/, because a reader downloads the release
          # assets into one flat directory and runs `sha256sum -c SHA256SUMS`
          # there. `sha256sum dist/*` writes `dist/<name>` on every line, so
          # that command reports each asset as a file it cannot open and exits
          # 1: the published checksums could not check the published files.
          # Measured against v0.1.0's own SHA256SUMS, whose digests are correct.
          # Written outside dist/ first so the glob cannot reach the file being
          # written, and named by extension so a stray artifact in dist/ is a
          # failure rather than an extra line.
          (cd dist && sha256sum exitdrill-*.whl exitdrill-*.tar.gz) > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" dist/SHA256SUMS
      - name: Upload immutable candidate inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    name: recheck the immutable tag and publish the GitHub Release
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Recheck the immutable tag object and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out code, so `gh` has no git remote to infer
          # the repository from and shells out to git looking for one. Naming it
          # explicitly is what lets a publish step work without a working tree.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-assets/release-notes.md \
            release-assets/dist/*
